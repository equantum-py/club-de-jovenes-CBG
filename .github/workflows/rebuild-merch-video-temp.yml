name: Rebuild merch video temp

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-merch-video-temp.yml'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merch-video-asset

      - name: Rebuild MP4
        run: |
          cat .tmp-video/chunk-*.b64 | base64 --decode > public/videos/gracia-merch.mp4
          test "$(stat -c%s public/videos/gracia-merch.mp4)" -eq 230686
          file public/videos/gracia-merch.mp4

      - name: Generate poster
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y -ss 0.5 -i public/videos/gracia-merch.mp4 -frames:v 1 -q:v 3 public/videos/gracia-merch-poster.jpg

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit rebuilt assets to temp branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/videos/gracia-merch.mp4 public/videos/gracia-merch-poster.jpg
          git commit -m "fix: restaurar video completo de merch"
          git push origin HEAD:fix/merch-video-asset
